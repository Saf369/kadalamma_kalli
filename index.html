<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kadalamma Kalli - Exact Shoreline & Wave Surge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Exact Seashore Video Background */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      pointer-events: none;
      z-index: 1;
    }

    /* Interactive Sand Drawing Layer */
    #drawCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      pointer-events: auto;
      mix-blend-mode: multiply;
      opacity: 0.95;
      z-index: 10;
      cursor: crosshair;
      transform-origin: center 45%;
      transform: perspective(1200px) rotateX(60deg) scale(1.6);
    }

    /* Floating Top HUD */
    .top-hud {
      position: fixed;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.3s ease;
    }

    .title-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 15, 20, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .title-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px #22d3ee;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }

    .top-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      background: rgba(10, 15, 20, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: #22d3ee;
      border-color: #22d3ee;
      transform: scale(1.05);
    }

    .drawing-hint {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11.5px;
      color: rgba(254, 215, 170, 0.85);
      letter-spacing: 0.4px;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.55);
      padding: 4px 14px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 25;
      transition: opacity 0.3s ease;
    }

    .trigger-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 18, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 8px 6px 16px;
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      z-index: 30;
      max-width: 92%;
      pointer-events: auto;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }

    .trigger-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 13.5px;
      font-family: inherit;
      color: #67e8f9;
      width: 180px;
      letter-spacing: 0.2px;
      font-weight: 500;
    }

    .trigger-input::placeholder {
      color: rgba(255, 255, 255, 0.38);
    }

    .btn {
      background: linear-gradient(135deg, #2dd4bf, #06b6d4);
      border: none;
      outline: none;
      color: #03141f;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
    }

    .btn:hover {
      background: linear-gradient(135deg, #5eead4, #22d3ee);
      box-shadow: 0 6px 22px rgba(6, 182, 212, 0.5);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-sand {
      background: rgba(217, 180, 130, 0.2);
      color: #fed7aa;
      border: 1px solid rgba(217, 180, 130, 0.38);
      box-shadow: none;
    }

    .btn-sand:hover {
      background: rgba(217, 180, 130, 0.35);
      box-shadow: 0 4px 15px rgba(217, 180, 130, 0.3);
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(-50%);
      }

      20%,
      60% {
        transform: translateX(calc(-50% - 8px));
      }

      40%,
      80% {
        transform: translateX(calc(-50% + 8px));
      }
    }

    .hidden-hud {
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>

<body>

  <!-- Exact Shoreline Video Background -->
  <video id="bgVideo" src="/Firefly Cinematic ultra-wide landscape view of a scenic seashore. Extreme wide shot showing the vast.mp4" autoplay loop muted playsinline></video>

  <!-- Interactive Sand Drawing Layer -->
  <canvas id="drawCanvas" width="1600" height="900"></canvas>

  <!-- Top HUD -->
  <div class="top-hud" id="topHud">
    <div class="title-badge">
      <span class="dot"></span>
      <span>Kadalamma Kalli Shore</span>
    </div>
    <div class="top-buttons">
      <button class="icon-btn" id="soundBtn" title="Toggle Real Ocean Sound">🔇</button>
      <button class="icon-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
      <button class="icon-btn" id="hudToggleBtn" title="Hide/Show HUD">👁</button>
    </div>
  </div>

  <!-- Drawing Hint -->
  <div class="drawing-hint" id="drawingHint">
    ✍️ Click &amp; drag below the surf line to carve into the sand
  </div>

  <!-- Trigger Input & Controls -->
  <div class="trigger-bar" id="triggerBar">
    <input type="text" id="phraseInput" class="trigger-input" placeholder="Type 'kadalamma kalli'"
      value="kadalamma kalli" />
    <button class="btn" id="surgeBtn">Surge Wave</button>
    <button class="btn btn-sand" id="autoCarveBtn">Carve Preset</button>
    <button class="btn btn-secondary" id="clearBtn">Clear</button>
  </div>

  <script>
    const TARGET_PHRASE = 'kadalamma kalli';
    const SAND_TOP_RATIO = 0.45; // Sand region is lower 55% of video

    const bgVideo = document.getElementById('bgVideo');
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

    const phraseInput = document.getElementById('phraseInput');
    const surgeBtn = document.getElementById('surgeBtn');
    const autoCarveBtn = document.getElementById('autoCarveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const triggerBar = document.getElementById('triggerBar');
    const soundBtn = document.getElementById('soundBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const hudToggleBtn = document.getElementById('hudToggleBtn');
    const topHud = document.getElementById('topHud');
    const drawingHint = document.getElementById('drawingHint');

    let hudVisible = true;

    // Draw realistic carved line in sand
    function drawCarvedLine(x1, y1, x2, y2, radius = 3) {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const steps = Math.max(1, Math.ceil(dist / 2.5));
      const scale = radius / 9;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = x1 + (x2 - x1) * t;
        const cy = y1 + (y2 - y1) * t;

        // Displaced sand rim highlight
        drawCtx.beginPath();
        drawCtx.arc(cx - 3 * scale, cy - 3 * scale, radius * 1.3, 0, Math.PI * 2);
        drawCtx.fillStyle = 'rgba(248, 232, 204, 0.28)';
        drawCtx.fill();

        // Dark trench shadow
        drawCtx.beginPath();
        drawCtx.arc(cx + 2.5 * scale, cy + 2.5 * scale, radius * 1.05, 0, Math.PI * 2);
        drawCtx.fillStyle = 'rgba(38, 20, 8, 0.85)';
        drawCtx.fill();

        // Deep trench core
        drawCtx.beginPath();
        drawCtx.arc(cx + 1 * scale, cy + 1 * scale, radius * 0.5, 0, Math.PI * 2);
        drawCtx.fillStyle = 'rgba(20, 9, 3, 0.96)';
        drawCtx.fill();

        if (Math.random() < 0.15) {
          const ang = Math.random() * Math.PI * 2;
          const sDist = radius * (1.1 + Math.random() * 0.4);
          drawCtx.beginPath();
          drawCtx.arc(cx + Math.cos(ang) * sDist, cy + Math.sin(ang) * sDist, 1.2 * scale, 0, Math.PI * 2);
          drawCtx.fillStyle = Math.random() > 0.5 ? 'rgba(240, 220, 185, 0.65)' : 'rgba(30, 15, 5, 0.7)';
          drawCtx.fill();
        }
      }
    }



    window.addEventListener('pointercancel', () => { isDrawing = false; });

    // Cursive Preset Carve
    function autoCarveText(text = TARGET_PHRASE) {
      const temp = document.createElement('canvas');
      temp.width = drawCanvas.width;
      temp.height = drawCanvas.height;
      const tctx = temp.getContext('2d');

      tctx.fillStyle = '#fff';
      tctx.font = 'bold 24px "Brush Script MT", "Segoe Script", "Dancing Script", cursive, sans-serif';
      tctx.textAlign = 'center';
      tctx.textBaseline = 'middle';

      const cx = temp.width * 0.5;
      const cy = temp.height * 0.74;
      tctx.fillText(text, cx, cy);

      const pData = tctx.getImageData(0, 0, temp.width, temp.height).data;
      const points = [];
      for (let y = cy - 40; y < cy + 40; y += 4) {
        for (let x = cx - 200; x < cx + 200; x += 4) {
          if (pData[(y * temp.width + x) * 4 + 3] > 100) {
            points.push({ x: x + (Math.random() - 0.5) * 2, y: y + (Math.random() - 0.5) * 2 });
          }
        }
      }

      points.sort((a, b) => {
        const dx = a.x - b.x;
        return Math.abs(dx) > 28 ? dx : a.y - b.y;
      });

      let idx = 0;
      let prev = null;
      function step() {
        const batch = Math.min(points.length, idx + 22);
        for (let i = idx; i < batch; i++) {
          const pt = points[i];
          if (prev && Math.hypot(pt.x - prev.x, pt.y - prev.y) < 48) {
            drawCarvedLine(prev.x, prev.y, pt.x, pt.y, 8);
          } else {
            drawCarvedLine(pt.x, pt.y, pt.x, pt.y, 8);
          }
          prev = pt;
        }
        idx = batch;
        if (idx < points.length) {
          requestAnimationFrame(step);
        }
      }
      step();
    }

    setTimeout(() => {
      autoCarveText(TARGET_PHRASE);
    }, 500);

    // Destructive wash-away synchronized with video time
    function eraseCanvasWithWaveFront(progress) {
      if (progress <= 0.01) return;

      const startY = 0.45 * drawCanvas.height;
      const targetY = 0.92 * drawCanvas.height;
      const currentWashY = startY + (targetY - startY) * Math.min(1.0, progress);

      drawCtx.save();
      
      // Create a clipping mask matching the wave's shape (center wedge)
      drawCtx.beginPath();
      drawCtx.moveTo(drawCanvas.width * 0.25, startY);
      drawCtx.lineTo(drawCanvas.width * 0.75, startY);
      drawCtx.lineTo(drawCanvas.width * 0.95, drawCanvas.height);
      drawCtx.lineTo(drawCanvas.width * 0.05, drawCanvas.height);
      drawCtx.closePath();
      drawCtx.clip();

      drawCtx.globalCompositeOperation = 'destination-out';

      drawCtx.fillStyle = 'rgba(0, 0, 0, 1.0)';
      drawCtx.fillRect(0, 0, drawCanvas.width, Math.max(0, currentWashY - 40));

      const grad = drawCtx.createLinearGradient(0, Math.max(0, currentWashY - 40), 0, currentWashY + 40);
      grad.addColorStop(0, 'rgba(0, 0, 0, 1.0)');
      grad.addColorStop(0.65, 'rgba(0, 0, 0, 0.85)');
      grad.addColorStop(0.9, 'rgba(0, 0, 0, 0.35)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');

      drawCtx.fillStyle = grad;
      drawCtx.fillRect(0, Math.max(0, currentWashY - 40), drawCanvas.width, 80);

      drawCtx.restore();
    }

    bgVideo.addEventListener('timeupdate', () => {
      const curTime = bgVideo.currentTime;
      if (curTime >= 0.8 && curTime <= 3.4) {
        const surgeProgress = (curTime - 0.8) / 2.4;
        eraseCanvasWithWaveFront(surgeProgress);
      } else if (curTime > 3.4 && curTime <= 4.0) {
        eraseCanvasWithWaveFront(1.0);
      }
    });

    // Sound toggle
    soundBtn.addEventListener('click', () => {
      bgVideo.muted = !bgVideo.muted;
      soundBtn.textContent = bgVideo.muted ? '🔇' : '🔊';
    });

    // Fullscreen toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else {
        document.exitFullscreen().catch(() => { });
      }
    });

    // HUD toggle
    hudToggleBtn.addEventListener('click', () => {
      hudVisible = !hudVisible;
      topHud.classList.toggle('hidden-hud', !hudVisible);
      drawingHint.classList.toggle('hidden-hud', !hudVisible);
      triggerBar.classList.toggle('hidden-hud', !hudVisible);
    });

    // Trigger Surge
    function triggerSurge() {
      bgVideo.currentTime = 0.8;
      bgVideo.play().catch(() => { });
    }

    function checkAndTrigger() {
      const val = phraseInput.value.trim().toLowerCase();
      if (val === TARGET_PHRASE) {
        triggerSurge();
      } else {
        triggerBar.classList.remove('shake');
        void triggerBar.offsetWidth;
        triggerBar.classList.add('shake');
      }
    }

    surgeBtn.addEventListener('click', checkAndTrigger);
    phraseInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAndTrigger();
    });

    autoCarveBtn.addEventListener('click', () => autoCarveText(TARGET_PHRASE));
    clearBtn.addEventListener('click', () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });
  </script>
</body>

</html>
